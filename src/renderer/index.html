<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Monti</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="dragbar"></div>
  <div class="app" id="app">
    <aside class="rail">
      <div class="brand"><div class="brand-mark">M</div><b>Monti</b></div>
      <button class="machine" id="machine" type="button" title="This Mac and its Claude account">
        <div>This Mac: <strong id="machine-name">…</strong> <span id="machine-role"></span></div>
        <div class="acct" id="machine-acct"><span>Checking Claude login…</span></div>
        <div class="manage">Account &amp; sign out ›</div>
      </button>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot">
        <button class="btn" id="mgr-toggle" type="button">Ask the Manager</button>
        <button class="btn primary" id="new-project" type="button">+ New project</button>
      </div>
    </aside>

    <main class="main" id="main">
      <section class="overview" id="overview"></section>
      <div class="resizer" id="resizer" title="Drag to resize"></div>
      <section class="dock" aria-label="Claude sessions">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="stage" id="stage"><div class="dock-empty" id="dock-empty"></div></div>
      </section>
    </main>

    <aside class="mgr" aria-label="Manager">
      <div class="mgr-head">
        <div class="mgr-av">M</div>
        <div><b>Manager</b><small>Reads every session, diff and memory file. Plans tasks; doesn't edit code.</small></div>
        <button class="x" id="mgr-close" type="button" aria-label="Close Manager">×</button>
      </div>
      <div class="watch" id="watch"></div>
      <div class="chat" id="chat"></div>
      <form class="mgr-in" id="mgr-form">
        <textarea id="mgr-q" placeholder="Ask about any project or session…" aria-label="Ask the Manager"></textarea>
        <div class="row">
          <button class="btn ghost small" id="mgr-reset" type="button" title="Start a new Manager conversation">New conversation</button>
          <div class="row">
            <button class="btn small" id="mgr-stop" type="button" hidden>Stop</button>
            <button class="btn primary small" id="mgr-send" type="submit">Ask</button>
          </div>
        </div>
      </form>
    </aside>
  </div>

  <div class="overlay" id="auth" hidden>
    <div class="card">
      <div class="auth-mark">M</div>
      <h1 id="auth-title">Checking your Claude login…</h1>
      <p id="auth-text"></p>
      <div class="auth-account" id="auth-account" hidden></div>
      <label class="check" id="auth-lock-row" hidden><input type="checkbox" id="auth-lock"> Only allow this organization on this Mac</label>
      <div id="auth-role" hidden></div>
      <div class="actions left" id="auth-actions"></div>
      <div class="auth-term" id="auth-term" hidden></div>
      <p class="auth-foot">Monti never stores your Claude login. Sessions use the account Claude Code is signed into on this Mac.</p>
    </div>
  </div>

  <div class="overlay" id="modal" hidden><div class="card" id="modal-card"></div></div>
  <div class="toast" id="toast" hidden></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="util.js"></script>
  <script src="terminals.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
